general:
  execute: &execute true
  lidc_regular_dataset_path: &lidc_regular_dataset_path ./support_images/dataset/raw
  lidc_regular_mask_path: &lidc_regular_mask_path ./support_images/dataset/raw
  lidc_edge_dataset_path: &lidc_edge_dataset_path ./support_images/dataset/raw2
  lidc_edge_mask_path: &lidc_edge_mask_path ./support_images/dataset/raw
  vess_regular_dataset_path: &vess_regular_dataset_path ./support_images/dataset/Vessel
  vess_regular_mask_path: &vess_regular_mask_path ./support_images/dataset/Vessel
  vess_edge_dataset_path: &vess_edge_dataset_path ./support_images/dataset/vessel_gt+edge+mask/train
  vess_edge_mask_path: &vess_edge_mask_path ./support_images/dataset/Vessel
  epochs: &epochs 200
  folds: &folds 5
  seed: &seed 42
experimentos:
  - name: Experimento 1 LIDC
    description: Experimento com loss Dice LIDC
    filename: "imagem_regular_200_epocas_10_folds_dice"
    execute: *execute
    parameters:
      loss_type: dice
      swap: 0.5
      epochs: *epochs
      folds: *folds
      dataset_path: *lidc_regular_dataset_path
      mask_path: *lidc_regular_mask_path
      simple: false
      input_dimensions: 1
      num_classes: 1
  - name: Experimento 1 Vessel
    description: Experimento com loss Dice Vessel
    filename: "vessel_regular_200_epocas_10_folds_dice"
    execute: *execute
    parameters:
      loss_type: dice
      swap: 0.5
      epochs: *epochs
      folds: *folds
      dataset_path: *vess_regular_dataset_path
      mask_path: *vess_regular_mask_path
      simple: false
      input_dimensions: 1
      num_classes: 1
  - name: Experimento 2 LIDC
